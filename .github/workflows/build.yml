name: Build Patched IPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # The only supported build path.  It drives GoldenNuggetMobile.xcodeproj
      # through xcodebuild and packages build/GoldenNuggetMobile.ipa; the same
      # script is what the local workflow runs, so CI and the host cannot
      # drift apart.
      - name: Build IPA
        run: ./scripts/build-ipa.sh Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldenNuggetMobile-patched
          path: build/GoldenNuggetMobile.ipa
          if-no-files-found: error

# Manual rebuild trigger
