on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        host:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.host.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build image
        run: |
          docker build . -t assetkit
      - name: Test
        run: |
          docker run -v .:/work -w /work -t assetkit swift test
  build-macos:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/configure-xcode
      - name: Build and test
        run: |
          swift test
